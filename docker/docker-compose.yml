version: '3.8'

services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: infrarisk-dashboard
    ports:
      - "8501:8501"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FEAST_USAGE=true
    volumes:
      - ../data:/app/data
    depends_on:
      - mlflow
      - feast
    restart: always

  mlflow:
    image: python:3.10-slim
    container_name: infrarisk-mlflow
    ports:
      - "5000:5000"
    working_dir: /mlflow
    volumes:
      - ../mlruns:/mlflow/mlruns
    command: >
      sh -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/mlruns"
    restart: always

  feast:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: infrarisk-feast
    ports:
      - "6566:6566"
    working_dir: /app
    volumes:
      - ../data:/app/data
    # Start Feast feature server (assuming feature_store.yaml is in a folder or we serve a default feature store)
    command: >
      sh -c "feast serve -h 0.0.0.0 -p 6566"
    restart: always
